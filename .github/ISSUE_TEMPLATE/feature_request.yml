name: Feature request
description: Suggest an idea or workflow for Q-Panel
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior or workflow you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Quarterly planning
        - Weekly plan
        - Projects
        - Reminders
        - Notes
        - Links
        - AI
        - macOS / packaging
        - Other
